<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar(${activo})}"></nav>
<main class="container mt-5 mb-5 flex-grow-1">
    <div class="row justify-content-center"><div class="col-12 col-lg-10">
        <div th:replace="~{fragments/layout :: alertas}"></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 fw-bold">Gestión de categorías</h1>
            <a th:href="@{/categorias/nueva}" class="btn btn-primary shadow-sm">Nueva categoría</a>
        </div>
        <div class="card shadow-sm"><div class="card-body p-0"><div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th class="ps-4 py-3 border-0">#</th><th class="py-3 border-0">Nombre</th>
                    <th class="py-3 border-0">Descripción</th><th class="py-3 border-0">Estado</th>
                    <th class="text-center py-3 border-0">Acciones</th>
                </tr></thead>
                <tbody>
                    <tr th:each="c : ${categorias}">
                        <th class="ps-4" th:text="${c.id}">1</th>
                        <td class="fw-medium"><span th:text="${c.icono}"></span> <span th:text="${c.nombre}">Bebidas</span></td>
                        <td class="text-muted" th:text="${c.descripcion}">Descripción</td>
                        <td>
                            <span th:if="${c.activo}" class="badge bg-success bg-opacity-10 text-success border border-success px-2 py-1">Activo</span>
                            <span th:unless="${c.activo}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary px-2 py-1">Oculto</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/categorias/{id}/editar(id=${c.id})}" class="btn btn-sm btn-outline-secondary fw-bold">Editar</a>
                            <a th:if="${c.activo}" th:href="@{/categorias/{id}/desactivar(id=${c.id})}" class="btn btn-sm btn-outline-danger fw-bold">Ocultar</a>
                            <form th:unless="${c.activo}" th:action="@{/categorias/{id}/activar(id=${c.id})}" method="post" class="inline">
                                <button type="submit" class="btn btn-sm btn-outline-secondary fw-bold">Reactivar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div></div></div>
    </div></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
