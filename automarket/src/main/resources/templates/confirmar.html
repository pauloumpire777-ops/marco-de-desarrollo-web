<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${titulo})}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar(${activo})}"></nav>
<main class="container flex-grow-1">
    <div class="row justify-content-center align-items-center" style="min-height: 65vh;">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5">
            <div class="card border border-danger shadow">
                <div class="card-body text-center p-4">
                    <h4 class="text-danger mb-3" th:text="${titulo}">Confirmar</h4>
                    <p th:text="${mensaje}">¿Está seguro?</p>
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <form th:action="@{${accion}}" method="post" class="inline">
                            <button type="submit" class="btn btn-danger" th:text="${boton}">Confirmar</button>
                        </form>
                        <a th:href="@{${cancelar}}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
