<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ============ HEAD común ============ -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | AutoMarket Express'">AutoMarket Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<!-- ============ NAVBAR (resalta la sección activa; Personal/Analítica solo para Supervisor) ============ -->
<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-light bg-white">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/main}">🛒 AutoMarket <span class="text-dark">Express</span></a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto gap-2 align-items-lg-center">
                <li class="nav-item"><a class="nav-link fw-medium" th:classappend="${activo == 'inicio'} ? 'activo'" th:href="@{/main}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" th:classappend="${activo == 'categorias'} ? 'activo'" th:href="@{/categorias}">Categorías</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" th:classappend="${activo == 'productos'} ? 'activo'" th:href="@{/productos}">Inventario</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" th:classappend="${activo == 'caja'} ? 'activo'" th:href="@{/caja}">Caja Rápida</a></li>
                <li class="nav-item" th:if="${usuarioActual != null and usuarioActual.supervisor}"><a class="nav-link fw-medium" th:classappend="${activo == 'usuarios'} ? 'activo'" th:href="@{/usuarios}">Personal</a></li>
                <li class="nav-item" th:if="${usuarioActual != null and usuarioActual.supervisor}"><a class="nav-link fw-medium" th:classappend="${activo == 'metricas'} ? 'activo'" th:href="@{/metricas}">Analítica</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" th:classappend="${activo == 'publicidad'} ? 'activo'" th:href="@{/publicidad}">Promociones</a></li>
                <li class="nav-item"><a class="nav-link fw-medium" th:classappend="${activo == 'contacto'} ? 'activo'" th:href="@{/contacto}">Soporte</a></li>
                <li class="nav-item d-flex align-items-center gap-2 ms-lg-3" th:if="${usuarioActual != null}">
                    <span class="small text-muted"><span th:text="${usuarioActual.nombre}">Usuario</span>
                        <span class="badge bg-dark" th:text="${usuarioActual.rol}">Rol</span></span>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/logout}">Salir</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ============ ALERTAS (msg = éxito, error = regla/validación) ============ -->
<div th:fragment="alertas">
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<!-- ============ FOOTER y scripts ============ -->
<footer th:fragment="footer" class="mt-auto py-3 text-center text-muted small">
    <div class="container">
        <hr class="mb-3" style="opacity: .1;">
        <p class="mb-0">© 2026 AutoMarket Express. Plataforma de Autopago y Gestión.</p>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
