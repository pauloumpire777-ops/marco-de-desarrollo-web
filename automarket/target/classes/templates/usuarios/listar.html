<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Personal')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar(${activo})}"></nav>
<main class="container mt-5 mb-5 flex-grow-1">
    <div class="row justify-content-center"><div class="col-12 col-lg-11">
        <div th:replace="~{fragments/layout :: alertas}"></div>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0 fw-bold">Gestión de personal</h1>
            <a th:href="@{/usuarios/nuevo}" class="btn btn-primary shadow-sm">Registrar colaborador</a>
        </div>
        <div class="card shadow-sm"><div class="card-body p-0"><div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr>
                    <th class="ps-4 py-3 border-0">ID</th><th class="py-3 border-0">Nombre completo</th>
                    <th class="py-3 border-0">Correo corporativo</th><th class="py-3 border-0 text-center">Rol</th>
                    <th class="py-3 border-0 text-center">Acceso</th><th class="text-center py-3 border-0">Acciones</th>
                </tr></thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <th class="ps-4 text-muted" th:text="${u.codigo}">EMP-0001</th>
                        <td class="fw-medium" th:text="${u.nombre}">Nombre</td>
                        <td class="text-muted small" th:text="${u.correo}">correo</td>
                        <td class="text-center"><span class="badge text-white" th:classappend="${u.supervisor} ? 'bg-dark' : 'bg-primary'" th:text="${u.rol}">Rol</span></td>
                        <td class="text-center">
                            <span th:if="${u.activo}" class="badge bg-success bg-opacity-75">Activo</span>
                            <span th:unless="${u.activo}" class="badge bg-secondary">Suspendido</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/usuarios/{c}/editar(c=${u.codigo})}" class="btn btn-sm btn-outline-secondary fw-bold">Modificar</a>
                            <a th:if="${u.activo}" th:href="@{/usuarios/{c}/bloquear(c=${u.codigo})}" class="btn btn-sm btn-outline-danger fw-bold">Bloquear</a>
                            <form th:unless="${u.activo}" th:action="@{/usuarios/{c}/desbloquear(c=${u.codigo})}" method="post" class="inline">
                                <button type="submit" class="btn btn-sm btn-outline-secondary fw-bold">Desbloquear</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div></div></div>
    </div></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
